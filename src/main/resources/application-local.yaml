spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/inside_invoice
    username: insideinvoice
    password: invoiceinside
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

app:
  base-url: http://localhost:8080
  frontend-base-url: http://localhost:5173
  # Local-only convenience: seed invoiceinside on a fresh dev DB. Never on in prod.
  seed-default-admin: true

backup:
  enabled: false

logging:
  level:
    com.insideinvoice: DEBUG
