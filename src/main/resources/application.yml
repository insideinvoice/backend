spring:
  application:
    name: inside-invoice
  profiles:
    active: prod
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://neondb_owner:npg_lzQnCNUwu27r@ep-proud-sky-b48o74qh-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require&socketTimeout=30&connectTimeout=10&tcpKeepAlive=true
    username: neondb_owner
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 600000
      keepalive-time: 30000
      validation-timeout: 5000
  jpa:
    # SQL logging off: show-sql wrote statements with row/PII values into production logs.
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
  servlet:
    multipart:
      # Aligned with the 1MB check in BusinessController.uploadSignature; oversized parts
      # now fail at the container edge as MaxUploadSizeExceededException → 413.
      max-file-size: 1MB
      max-request-size: 2MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
  task:
    scheduling:
      # Backup scheduler previously owned the only scheduling thread: a hung pg_dump
      # wedged every other scheduled task. Give backups their own room.
      pool:
        size: 2
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    show-details: never
    probes:
      enabled: true
  info:
    enabled: true
    app:
      name: Inside Invoice
      description: SaaS Multi-Tenant Invoicing Platform
      version: 1.0.0
