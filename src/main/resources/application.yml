logging:
  # Every line carries [%X{reqId}] — the per-request trace id set by
  # RequestTraceFilter. Under load, grep one id to follow that request's
  # full journey (controller, service, handler, stack trace).
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{reqId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.insideinvoice: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO