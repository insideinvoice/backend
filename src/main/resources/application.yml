spring:
  application:
    name: inside-invoice
  profiles:
    active: prod
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd
    time-zone: UTC
  datasource:
    # Local runs read these from the environment (start-local.sh exports them).
    # In prod, application-prod.yaml supplies the datasource outright.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 600000
      keepalive-time: 30000
      validation-timeout: 5000
  jpa:
    # SQL logging off: show-sql wrote statements with row/PII values into production logs.
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
  servlet:
    multipart:
      # Signature upload enforces its own 1MB check inline (BusinessController);
      # the container limit is raised here so the invoice bulk-import endpoint
      # can accept larger .xlsx workbooks. Oversized parts still fail at the
      # container edge as MaxUploadSizeExceededException -> 413.
      max-file-size: 10MB
      max-request-size: 15MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
  task:
    scheduling:
      # Backup scheduler previously owned the only scheduling thread: a hung pg_dump
      # wedged every other scheduled task. Give backups their own room.
      pool:
        size: 2
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    show-details: never
    probes:
      enabled: true
  info:
    enabled: true
    app:
      name: Inside Invoice
      description: SaaS Multi-Tenant Invoicing Platform
      version: 1.0.0
