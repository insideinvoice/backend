spring:
  application:
    name: inside-invoice
  config:
    # Secrets stay OUT of git: any non-DB credential lives in local-secrets.yml
    # (gitignored, repo root, resolved relative to the working directory). DB
    # credentials come from the environment only (see start-local.sh) so a
    # clone boots loud-and-clear instead of silently inheriting creds from
    # commit history.
    import: "optional:file:./local-secrets.yml"
  profiles:
    active: prod
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd
    time-zone: UTC
  datasource:
    # Both from the environment (start-local.sh exports them; direct runs set
    # them alongside SPRING_PROFILES_ACTIVE). No fallback: a missing value
    # fails boot with an "unresolvable placeholder" message on purpose.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 600000
      keepalive-time: 30000
      validation-timeout: 5000
  jpa:
    # SQL logging off: show-sql wrote statements with row/PII values into production logs.
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
  servlet:
    multipart:
      # Signature upload enforces its own 1MB check inline (BusinessController);
      # the container limit is raised here so the invoice bulk-import endpoint
      # can accept larger .xlsx workbooks. Oversized parts still fail at the
      # container edge as MaxUploadSizeExceededException -> 413.
      max-file-size: 10MB
      max-request-size: 15MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
  task:
    scheduling:
      # Backup scheduler previously owned the only scheduling thread: a hung pg_dump
      # wedged every other scheduled task. Give backups their own room.
      pool:
        size: 2
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    show-details: never
    probes:
      enabled: true
  info:
    enabled: true
    app:
      name: Inside Invoice
      description: SaaS Multi-Tenant Invoicing Platform
      version: 1.0.0
backup:
  enabled: true
  retention-days: 90
  timeout-minutes: 30
  google-drive:
    root-folder-id: 11Gr5nyaK7VZBJxSwxOmQrkRZPt0sSYyt
    client-id: 1084673576585-ah2ms2300big3uk4smjmgikav29lbjs9.apps.googleusercontent.com
    # Secret + refresh token: file:./local-secrets.yml (gitignored)
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET}
    refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN}
app:
  # Canonical frontend origin — fallback for share links built by the server
  # (public invoice emails). The frontend passes its own origin when it can.
  frontend-base-url: https://insideinvoice.in
  # NOTE: keys live under app.mail.* — EmailService reads ${app.mail.*}.
  # The resend-api-key value is base64-encoded (decoded before use).
  mail:
    resend-api-key: ${RESEND_API_KEY}   # value lives in local-secrets.yml (gitignored; decoded before use)
    from: noreply@insideinvoice.com
    logo-url: ""   # optional public URL of the seller logo shown in invoice emails (max 40px high; blank = text-only header)
    contact-email: insideinvoice87@gmail.com
  jwt:
    secret: ${JWT_SECRET}   # value lives in local-secrets.yml (gitignored)
    # Normal session: 6h. "Remember me": 7 days. Logout happens when the token's
    # own exp passes — not when the browser closes.
    expiration-ms: 21600000
    remember-me-expiration-ms: 604800000
    refresh-expiration-ms: 2592000000
logging:
  # Every line carries [%X{reqId}] — the per-request trace id set by
  # RequestTraceFilter. Under load, grep one id to follow that request's
  # full journey (controller, service, handler, stack trace).
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{reqId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.insideinvoice: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO